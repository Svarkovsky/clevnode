name: Build & Release Multi-Arch

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  security-and-static-analysis:
    name: Security & Static Analysis (ASan & Analyzer)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run GCC Static Analyzer
        run: |
          gcc -fanalyzer -Wall -Wextra -Werror -Iclevnode -c clevnode/clevnode.c -o /dev/null

      - name: Run Path Traversal & Memory Lifecycle Tests (ASan + UBSan)
        run: |
          gcc -Wall -Wextra -Werror -Iclevnode -fsanitize=address,undefined clevnode/test_security.c -lpthread -o ./test_sec_bin
          ./test_sec_bin
          rm -f ./test_sec_bin

  build:
    name: Build ${{ matrix.arch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: mips-unknown-linux-musl
            arch: mips-ath79-bigendian
            toolchain_url: https://github.com/userdocs/qbt-musl-cross-make/releases/latest/download/x86_64-mips-linux-musl.tar.xz
            toolchain_dir: mips-linux-musl
            cc: mips-linux-musl-gcc
            strip: mips-linux-musl-strip
            cflags: -Os -march=24kc -mtune=24kc -mno-branch-likely -msoft-float -fno-ident -fno-stack-protector -fomit-frame-pointer -fno-unwind-tables -fno-asynchronous-unwind-tables -mno-shared -no-pie
            ldflags: -static -no-pie -Wl,--gc-sections -lpthread -lrt -lgcc -Wl,--build-id=none -Wl,-z,norelro -Wl,-O2 -Wl,--exclude-libs,ALL
            qemu: qemu-mips-static

          - target: mipsel-unknown-linux-musl
            arch: mipsel-ramips-littleendian
            toolchain_url: https://github.com/userdocs/qbt-musl-cross-make/releases/latest/download/x86_64-mipsel-linux-musl.tar.xz
            toolchain_dir: mipsel-linux-musl
            cc: mipsel-linux-musl-gcc
            strip: mipsel-linux-musl-strip
            cflags: -Os -march=24kc -mtune=24kc -mno-branch-likely -msoft-float -fno-ident -fno-stack-protector -fomit-frame-pointer -fno-unwind-tables -fno-asynchronous-unwind-tables -mno-shared -no-pie
            ldflags: -static -no-pie -Wl,--gc-sections -lpthread -lrt -lgcc -Wl,--build-id=none -Wl,-z,norelro -Wl,-O2 -Wl,--exclude-libs,ALL
            qemu: qemu-mipsel-static

          - target: armv7-unknown-linux-musleabihf
            arch: armv7-cortexa7-hardfloat
            toolchain_url: https://github.com/userdocs/qbt-musl-cross-make/releases/latest/download/x86_64-armv7l-linux-musleabihf.tar.xz
            toolchain_dir: armv7l-linux-musleabihf
            cc: armv7l-linux-musleabihf-gcc
            strip: armv7l-linux-musleabihf-strip
            cflags: -Os -march=armv7-a -mfpu=vfpv3-d16 -mfloat-abi=hard -fno-ident -fno-stack-protector -fomit-frame-pointer -fno-unwind-tables -fno-asynchronous-unwind-tables
            ldflags: -static -Wl,--gc-sections -lpthread -lrt -lgcc -Wl,--build-id=none -Wl,-z,norelro -Wl,-O2 -Wl,--exclude-libs,ALL
            qemu: qemu-arm-static

          - target: aarch64-unknown-linux-musl
            arch: arm64-aarch64
            toolchain_url: https://github.com/userdocs/qbt-musl-cross-make/releases/latest/download/x86_64-aarch64-linux-musl.tar.xz
            toolchain_dir: aarch64-linux-musl
            cc: aarch64-linux-musl-gcc
            strip: aarch64-linux-musl-strip
            cflags: -Os -march=armv8-a -fno-ident -fno-stack-protector -fomit-frame-pointer -fno-unwind-tables -fno-asynchronous-unwind-tables
            ldflags: -static -Wl,--gc-sections -lpthread -lrt -lgcc -Wl,--build-id=none -Wl,-z,norelro -Wl,-O2 -Wl,--exclude-libs,ALL
            qemu: qemu-aarch64-static

          - target: x86_64-unknown-linux-musl
            arch: x86_64-generic
            toolchain_url: https://github.com/userdocs/qbt-musl-cross-make/releases/latest/download/x86_64-x86_64-linux-musl.tar.xz
            toolchain_dir: x86_64-linux-musl
            cc: x86_64-linux-musl-gcc
            strip: x86_64-linux-musl-strip
            cflags: -Os -march=x86-64 -fno-ident -fno-stack-protector -fomit-frame-pointer -fno-unwind-tables -fno-asynchronous-unwind-tables
            ldflags: -static -Wl,--gc-sections -lpthread -lrt -lgcc -Wl,--build-id=none -Wl,-z,norelro -Wl,-O2 -Wl,--exclude-libs,ALL
            qemu: ""

          - target: i686-unknown-linux-musl
            arch: i686-x86-32bit
            toolchain_url: https://github.com/userdocs/qbt-musl-cross-make/releases/latest/download/x86_64-i686-linux-musl.tar.xz
            toolchain_dir: i686-linux-musl
            cc: i686-linux-musl-gcc
            strip: i686-linux-musl-strip
            cflags: -Os -march=i686 -fno-ident -fno-stack-protector -fomit-frame-pointer -fno-unwind-tables -fno-asynchronous-unwind-tables
            ldflags: -static -Wl,--gc-sections -lpthread -lrt -lgcc -Wl,--build-id=none -Wl,-z,norelro -Wl,-O2 -Wl,--exclude-libs,ALL
            qemu: qemu-i386-static

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install QEMU User Static Emulation
        run: |
          sudo apt-get update -o Acquire::Retries=3 -o Acquire::http::Timeout="15" -qq || true
          sudo apt-get install -y --no-install-recommends -qq qemu-user-static

      - name: Install Rust Nightly Toolchain
        run: |
          rustup toolchain install nightly --profile minimal
          rustup component add rust-src --toolchain nightly

      - name: Cache Musl Toolchain
        id: cache-toolchain
        uses: actions/cache@v4
        with:
          path: toolchains/${{ matrix.toolchain_dir }}
          key: toolchain-${{ matrix.toolchain_dir }}-v2

      - name: Download Musl Toolchain
        if: steps.cache-toolchain.outputs.cache-hit != 'true'
        run: |
          mkdir -p toolchains
          cd toolchains
          curl --retry 3 --retry-delay 5 -fSL "${{ matrix.toolchain_url }}" -o toolchain.tar.xz
          tar -xf toolchain.tar.xz
          rm -f toolchain.tar.xz

      - name: Build Rust static core (libleviculum.a)
        env:
          RUSTFLAGS: "-C force-unwind-tables=no -C embed-bitcode=no --remap-path-prefix=="
        run: |
          cd leviculum
          cargo +nightly build \
            --target ${{ matrix.target }} \
            --release \
            -p leviculum-ffi \
            -Zbuild-std=std,panic_abort \
            -Zbuild-std-features=optimize_for_size

      - name: Compile and Link clevnode C Monolith
        run: |
          TOOLCHAIN_BIN="$GITHUB_WORKSPACE/toolchains/${{ matrix.toolchain_dir }}/bin"
          export PATH="$TOOLCHAIN_BIN:$PATH"

          cp "leviculum/target/${{ matrix.target }}/release/libleviculum.a" "clevnode/libleviculum.a"

          cd clevnode
          ${{ matrix.cc }} ${{ matrix.cflags }} -I. clevnode.c libleviculum.a -o clevnode ${{ matrix.ldflags }}
          ${{ matrix.strip }} -s -R .comment -R .note -R .note.gnu.build-id -R .note.ABI-tag clevnode
          ls -lh clevnode

      - name: Verify Binary Execution via QEMU
        run: |
          cd clevnode
          if [ -n "${{ matrix.qemu }}" ]; then
            ${{ matrix.qemu }} ./clevnode --version
          else
            ./clevnode --version
          fi

      - name: Package Distribution Archive
        run: |
          VERSION="${GITHUB_REF_NAME:-v0.1.1}"
          TOOLCHAIN_BIN="$GITHUB_WORKSPACE/toolchains/${{ matrix.toolchain_dir }}/bin"
          CC_VER=$("${TOOLCHAIN_BIN}/${{ matrix.cc }}" --version | head -n 1)
          RUST_VER=$(rustc --version)
          chmod +x scripts/package_target.sh
          ./scripts/package_target.sh \
            clevnode/clevnode \
            "${{ matrix.arch }}" \
            "$VERSION" \
            Releases \
            "${{ matrix.cflags }}" \
            "${{ matrix.ldflags }}" \
            "${{ matrix.target }}" \
            "${{ matrix.cc }}" \
            "$CC_VER | $RUST_VER"

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: clevnode-${{ matrix.arch }}
          path: |
            Releases/*.zip
            Releases/*.zip.md5
          if-no-files-found: error

  publish:
    name: Publish Release Assets
    needs: [build, security-and-static-analysis]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Build Artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Consolidate Release Assets
        run: |
          mkdir -p release_assets
          find dist/ -type f \( -name "*.zip" -o -name "*.md5" \) -exec cp {} release_assets/ \;
          ls -la release_assets/

      - name: Generate Release Notes
        run: |
          cat << 'NOTES' > release_notes.md
          ## What's Changed in v0.1.1

          ### Multi-Architecture Builds
          Official standalone static release archives compiled against `musl libc` with pre-release QEMU execution verification for 6 hardware architectures:
          - **mips-ath79-bigendian** (`mips-unknown-linux-musl`): Qualcomm Atheros AR9xxx/QCA95xx (OpenWrt `ath79`, soft-float).
          - **mipsel-ramips-littleendian** (`mipsel-unknown-linux-musl`): MediaTek/Ralink MT7620/MT7621/MT7628 (OpenWrt/Keenetic `ramips`, soft-float).
          - **armv7-cortexa7-hardfloat** (`armv7-unknown-linux-musleabihf`): Cortex-A7/A9, Raspberry Pi 2 / Zero 2W, Orange Pi (hard-float).
          - **arm64-aarch64** (`aarch64-unknown-linux-musl`): Cortex-A53/A72, Raspberry Pi 3/4/5, modern ARM routers and servers.
          - **x86_64-generic** (`x86_64-unknown-linux-musl`): 64-bit Intel / AMD servers, PC, and VPS.
          - **i686-x86-32bit** (`i686-unknown-linux-musl`): 32-bit x86 legacy hardware and thin clients.

          ### Architecture & Resource Optimizations
          - **Unified Tokio Runtime:** Consolidated FFI event bridge and driver network I/O into a single shared Tokio worker (`reticulum-node`). Reduced permanent OS threads from 5-6 down to exactly 3.
          - **Clamped Thread Stacks:** Worker stack bounded to 128 KB via `thread_stack_size(128 * 1024)`. Virtual memory address space (`VmSize`) reduced from 33.2 MB to 19.8 - 25.0 MB, and peak memory spike (`VmPeak`) dropped from 47.8 MB to ~27.5 MB.
          - **Traffic Counter Thread Elimination:** Gated background 1-second polling thread under `#[cfg(feature = "rpc")]`.
          - **MIPS Hardware Acceleration:** Configured `opt-level = 3` for Curve25519/Ed25519/X25519 in release profile, unrolling 32-bit field multiplications for a 30-40% speedup on MIPS without FPU.
          - **Fast Packet Deduplication:** Replaced SipHash-1-3 in packet cache with zero-overhead `FastHashBuilder` (direct 8-byte prefix lookup on SHA-256 digests).
          - **Dead-Weight Elimination:** Removed regex dependencies (`regex-automata`, `regex-syntax`), isolated unused interface drivers (`kiss`, `pipe`, `rnode`, `serial`), and optionalized `serde_json`.

          ### Compilation Flags & Toolchain Matrix
          | Architecture | Target Triple | CFLAGS | LDFLAGS | C&nbsp;Library | Linker |
          |---|---|---|---|:---:|:---:|
          | **MIPS&nbsp;Big-Endian** | <sub>`mips-unknown-linux-musl`</sub> | <sub>`-Os -march=24kc -mtune=24kc -mno-branch-likely -msoft-float -fno-ident -fno-stack-protector -fomit-frame-pointer -fno-unwind-tables -fno-asynchronous-unwind-tables -mno-shared -no-pie`</sub> | <sub>`-static -no-pie -Wl,--gc-sections -lpthread -lrt -lgcc -Wl,--build-id=none -Wl,-z,norelro -Wl,-O2 -Wl,--exclude-libs,ALL`</sub> | musl&nbsp;1.2.5 | GNU&nbsp;ld |
          | **MIPSEL&nbsp;Little-Endian** | <sub>`mipsel-unknown-linux-musl`</sub> | <sub>`-Os -march=24kc -mtune=24kc -mno-branch-likely -msoft-float -fno-ident -fno-stack-protector -fomit-frame-pointer -fno-unwind-tables -fno-asynchronous-unwind-tables -mno-shared -no-pie`</sub> | <sub>`-static -no-pie -Wl,--gc-sections -lpthread -lrt -lgcc -Wl,--build-id=none -Wl,-z,norelro -Wl,-O2 -Wl,--exclude-libs,ALL`</sub> | musl&nbsp;1.2.5 | GNU&nbsp;ld |
          | **ARMv7-A&nbsp;32-bit** | <sub>`armv7-unknown-linux-musleabihf`</sub> | <sub>`-Os -march=armv7-a -mfpu=vfpv3-d16 -mfloat-abi=hard -fno-ident -fno-stack-protector -fomit-frame-pointer -fno-unwind-tables -fno-asynchronous-unwind-tables`</sub> | <sub>`-static -Wl,--gc-sections -lpthread -lrt -lgcc -Wl,--build-id=none -Wl,-z,norelro -Wl,-O2 -Wl,--exclude-libs,ALL`</sub> | musl&nbsp;1.2.5 | GNU&nbsp;ld |
          | **ARM64&nbsp;/&nbsp;AArch64** | <sub>`aarch64-unknown-linux-musl`</sub> | <sub>`-Os -march=armv8-a -fno-ident -fno-stack-protector -fomit-frame-pointer -fno-unwind-tables -fno-asynchronous-unwind-tables`</sub> | <sub>`-static -Wl,--gc-sections -lpthread -lrt -lgcc -Wl,--build-id=none -Wl,-z,norelro -Wl,-O2 -Wl,--exclude-libs,ALL`</sub> | musl&nbsp;1.2.5 | GNU&nbsp;ld |
          | **x86_64** | <sub>`x86_64-unknown-linux-musl`</sub> | <sub>`-Os -march=x86-64 -fno-ident -fno-stack-protector -fomit-frame-pointer -fno-unwind-tables -fno-asynchronous-unwind-tables`</sub> | <sub>`-static -Wl,--gc-sections -lpthread -lrt -lgcc -Wl,--build-id=none -Wl,-z,norelro -Wl,-O2 -Wl,--exclude-libs,ALL`</sub> | musl&nbsp;1.2.5 | GNU&nbsp;ld |
          | **i686&nbsp;32-bit** | <sub>`i686-unknown-linux-musl`</sub> | <sub>`-Os -march=i686 -fno-ident -fno-stack-protector -fomit-frame-pointer -fno-unwind-tables -fno-asynchronous-unwind-tables`</sub> | <sub>`-static -Wl,--gc-sections -lpthread -lrt -lgcc -Wl,--build-id=none -Wl,-z,norelro -Wl,-O2 -Wl,--exclude-libs,ALL`</sub> | musl&nbsp;1.2.5 | GNU&nbsp;ld |

          All targets compiled with Rust Nightly (`-Zbuild-std=std,panic_abort -Zbuild-std-features=optimize_for_size`).
          Each distribution ZIP contains `build_info.txt` with exact compilation flags, tools, and md5 checksums.
          NOTES

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: clevnode v0.1.1
          body_path: release_notes.md
          files: release_assets/*

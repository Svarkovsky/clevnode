[package]
name = "leviculum-lxmf-node"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
homepage.workspace = true
description = "LXMF test-harness node: drives leviculum-lxmf through the leviculum-std CoreProcessor seam, speaking periculum's lxmf_node protocol"

[[bin]]
name = "lxmf-node"
path = "src/main.rs"

# The two dependencies below are the whole point of this crate: it is the
# acceptance evidence for Codeberg #196's first criterion, "a std-driver
# application runs leviculum-lxmf end-to-end without forking leviculum-std".
# A separate package is what makes that claim checkable — the compiler refuses
# anything neither crate marks `pub`, so a gap in the public surface shows up
# as a build error here rather than as a quiet `pub(crate)` widening there.
[dependencies]
leviculum-core = { path = "../leviculum-core", default-features = true }
leviculum-std = { path = "../leviculum-std" }
leviculum-lxmf = { path = "../leviculum-lxmf" }
rand_core = { version = "0.6", features = ["std", "getrandom"] }
tokio.workspace = true

[dev-dependencies]
tempfile = "3"
